name: verificacao

on:
  push:
    branches: [main]
  pull_request:

# Menor permissao possivel: esta esteira so precisa ler o codigo.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      # Actions fixadas por SHA, e nao por tag: tag pode ser movida para outro
      # commit, e uma Action comprometida roda com acesso ao repositorio.
      - name: Baixar o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Preparar o Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Com cobertura, e nao so `test`: os limites em vitest.config.ts so sao
      # cobrados quando a cobertura roda. Sem isto eles seriam decorativos.
      - name: Testes com cobertura
        run: npm run cobertura
